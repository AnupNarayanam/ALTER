# ============================================================
# HYPRIDLE
# ============================================================
# Exists purely for security hygiene (auto-lock on a machine
# used for security research is non-negotiable) and battery
# life — not decorative. Timings chosen to not interrupt an
# active CTF/coding session but still lock a genuinely idle
# machine promptly.
# ============================================================

general {
    lock_cmd = pidof hyprlock || hyprlock --config ~/.config/hyprlock/hyprlock.conf
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300              # 5 min idle -> screen dims (early warning, not disruptive)
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 600              # 10 min idle -> lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900              # 15 min idle -> display off (saves power once locked)
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
