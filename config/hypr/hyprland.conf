# ============================================================
# ALTER — HYPRLAND ENTRYPOINT
# ============================================================
# This file only sources modular configs. It intentionally
# contains no settings itself — every setting lives in its
# own file under conf/ so nothing here is monolithic and any
# single concern (input, animations, rules) can be edited or
# disabled independently without touching the rest.
# ============================================================

source = ~/.config/hypr/conf/colors.conf
source = ~/.config/hypr/conf/monitors.conf
source = ~/.config/hypr/conf/input.conf
source = ~/.config/hypr/conf/general.conf
source = ~/.config/hypr/conf/decoration.conf
source = ~/.config/hypr/conf/animations.conf
source = ~/.config/hypr/conf/keybinds.conf
source = ~/.config/hypr/conf/windowrules.conf
source = ~/.config/hypr/conf/autostart.conf
