# ============================================================
# MONITORS
# ============================================================
# "preferred" lets Hyprland pick the native resolution/refresh
# rate automatically — one less thing to hardcode wrong on a
# fresh install. Replace with an explicit mode once you know
# your exact setup (e.g. 1920x1080@144,0x0,1).
# ============================================================

monitor = , preferred, auto, 1

# Example for a specific multi-monitor setup — uncomment and
# adjust once your layout is known:
# monitor = DP-1, 2560x1440@144, 0x0, 1
# monitor = HDMI-A-1, 1920x1080@60, 2560x0, 1
