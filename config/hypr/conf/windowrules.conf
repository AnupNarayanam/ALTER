# ============================================================
# WINDOW RULES
# ============================================================
# Rofi and lockscreen are forced floating + centered so they
# never get caught by the tiling layout — they're overlays,
# not tiled workspace members. Picture-in-picture and
# file-picker dialogs are floated for the same reason.
# ============================================================

windowrule = match:class ^(rofi)$, float on, center on

windowrule = match:class ^(pavucontrol)$, float on 
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:class ^(nm-connection-editor)$, float on

windowrule = match:title ^(Picture-in-Picture)$ float on, pin on

windowrule = match:class ^(virt-manager)$, float on
