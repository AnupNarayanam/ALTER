# ============================================================
# INPUT
# ============================================================
# Defaults tuned for a terminal-first, keyboard-heavy workflow.
# No accel curve tweaks by default — natural feel first,
# customize per-device once you notice friction.
# ============================================================

input {
    kb_layout = us
    follow_mouse = 1

    # Disabled: natural raw pointer movement is more predictable
    # during precise work (terminal selection, CTF tooling UIs)
    # than an acceleration curve fighting your muscle memory.
    accel_profile = flat
    sensitivity = 0

    touchpad {
        natural_scroll = true
        disable_while_typing = true   # avoids accidental cursor jumps mid-keystroke
    }
}

# Slight repeat delay tuning for fast terminal navigation
# (arrow-key history scroll, vim motions) without over-firing.
repeat_rate = 40
repeat_delay = 250

gesture = 3, horizontal, workspace
