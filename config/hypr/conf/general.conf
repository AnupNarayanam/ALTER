# ============================================================
# GENERAL
# ============================================================
# Window geometry rules from the spec: 8px rounding, 2px border,
# obsidian red when focused, dark gray when inactive. Gaps kept
# small — this is a workspace for dense terminal/IDE windows,
# not a showcase for floating whitespace.
# ============================================================

general {
    gaps_in = 4          # spacing between adjacent windows
    gaps_out = 8         # spacing between windows and screen edge
    border_size = 2      # spec: 2px border width

    col.active_border = $accent_focused
    col.inactive_border = $border

    layout = dwindle     # predictable auto-tiling, minimal manual fiddling
    resize_on_border = true
    allow_tearing = false
}

dwindle {
    preserve_split = true
}
