# ============================================================
# DECORATION
# ============================================================
# Spec rule: "Minimal blur. Only behind Launcher, Notifications,
# Lockscreen. Do not blur every window." Regular windows get
# ZERO blur — blur is expensive and, per the design philosophy,
# unearned decoration on a surface that doesn't need it.
#
# Spec rule: "No giant shadows. No glow effects." — shadow is
# disabled entirely rather than tuned down, since any shadow
# reads as decoration the spec explicitly rejects.
# ============================================================

decoration {
    rounding = 8              # spec: 8px rounded corners everywhere

    active_opacity = 1.0
    inactive_opacity = 0.97   # barely-there dimming, just enough to signal focus

    shadow {
        enabled = false       # spec: no giant shadows
    }

    blur {
        enabled = false       # OFF by default at the window-decoration level;
                               # launcher/notifications/lockscreen opt in
                               # individually in their own configs (rofi,
                               # swaync, hyprlock) rather than globally here.
    }
}

layerrule {
name = rofi_blur
match:namespace = rofi
blur = true
}
layerrule {
name = notif_blur
match:namespace = notifications
blur = true
}
layerrule {
name = lock_blur
match:namespace = lockscreen
blur = true
}
