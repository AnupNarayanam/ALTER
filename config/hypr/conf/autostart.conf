# ============================================================
# AUTOSTART
# ============================================================
# Only what's needed for the desktop to actually function is
# started here — spec priority is "boot quickly, minimal RAM
# usage, avoid unnecessary scripts." Nothing here polls; every
# process is event-driven (waybar/swaync/idle daemon) rather
# than a background loop.
# ============================================================

exec-once = waybar
exec-once = swaync
exec-once = hyprpaper
exec-once = hypridle
exec-once = /usr/lib/polkit-kde-authentication-agent-1   # needed for GUI auth prompts (e.g. VM tools)
exec-once = wl-paste --watch cliphist store                # clipboard history, no polling — event-driven watch
