# ============================================================
# ANIMATIONS
# ============================================================
# Spec: "Smooth. Fast. Natural. Professional. No bouncing.
# No exaggerated effects." — every curve below is a simple
# ease-out, no overshoot/elastic curves, and durations are
# kept short (under ~250ms) so motion never feels like it's
# in the way of getting work done.
# ============================================================

animations {
    enabled = true

    bezier = obsidianEase, 0.16, 1, 0.3, 1   # smooth ease-out, no overshoot

    animation = windows, 1, 3, obsidianEase, popin 85%
    animation = windowsOut, 1, 3, obsidianEase, popin 85%
    animation = border, 1, 4, obsidianEase
    animation = fade, 1, 3, obsidianEase
    animation = workspaces, 1, 3, obsidianEase, slide
    animation = specialWorkspace, 1, 3, obsidianEase, slidevert
}
