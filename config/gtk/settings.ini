# ============================================================
# GTK SETTINGS
# ============================================================
# Exists so any GTK app that gets opened (browser, occasional
# GUI tool) doesn't visually break the illusion of a unified
# OS — this is part of what makes the desktop feel handcrafted
# rather than "terminal + default-themed leftovers."
# ============================================================

[Settings]
gtk-theme-name=Adwaita-dark
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=Bibata-Modern-Classic
gtk-font-name=Inter 10
gtk-application-prefer-dark-theme=1

gtk-enable-animations=1
gtk-primary-button-warps-slider=0
