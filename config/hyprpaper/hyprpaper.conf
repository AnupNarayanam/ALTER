# ============================================================
# HYPRPAPER
# ============================================================
# Preload + set the default wallpaper. splash = false because
# the spec's minimalism doesn't want a Hyprland splash tag
# competing with the wallpaper's own restraint.
# ============================================================

preload = ~/.config/assets/wallpapers/default.png

wallpaper = , ~/.config/assets/wallpapers/default.png

splash = false
ipc = on              # allows scripts/theme-switcher.sh to swap wallpapers live if used
