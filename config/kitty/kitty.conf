# ============================================================
# KITTY — TERMINAL
# ============================================================
# Rule (confirmed explicitly): terminal is a READING surface,
# not a glancing one — white text dominant, black background,
# red reserved only for cursor and selection so it draws the
# eye exactly where attention is needed and nowhere else.
# No transparency: this is the primary work surface for long
# sessions (CTFs, code, docs) and needs maximum legibility.
# ============================================================

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        12.0

background       #090909
foreground       #FFFFFF

cursor            #B00020
cursor_text_color #090909
cursor_shape      block
cursor_blink_interval 0.5

selection_background #B00020
selection_foreground #FFFFFF

background_opacity 1.0 

# --- 16-color palette: kept desaturated except red, so ANSI
# output (ls colors, git diff, tool output) doesn't fight the
# black/white/red design language elsewhere on the desktop. ---
color0  #101010
color8  #555555
color1  #B00020
color9  #FF1F3D
color2  #C7C7C7
color10 #FFFFFF
color3  #8C8C8C
color11 #C7C7C7
color4  #8C8C8C
color12 #C7C7C7
color5  #B00020
color13 #FF1F3D
color6  #8C8C8C
color14 #C7C7C7
color7  #C7C7C7
color15 #FFFFFF

window_border_width 2px
active_border_color   #FF1F3D
inactive_border_color #2A2A2A

window_padding_width 8

confirm_os_window_close 0

# Tabs styled to match the flat, no-glow language elsewhere
tab_bar_style          fade
tab_bar_edge           bottom
tab_fade               1
active_tab_background  #171717
active_tab_foreground  #FFFFFF
inactive_tab_background #090909
inactive_tab_foreground #8C8C8C
