# ============================================================
# HYPRLOCK — LOCKSCREEN
# ============================================================
# Spec surfaces only: clock, date, wallpaper, blur, password
# field — nothing else (no greeting text, no extra widgets).
#
# Layout follows reference 5's structure: date sits above the
# time in a thin bracket frame, time is huge and centered, day
# sits below in a mirrored bracket. Typography stays inside the
# two-font rule (Inter only) — sharpness comes from Black/Extrabold
# weight and tight letter-spacing, not a third decorative font.
# ============================================================

background {
    monitor =
    path = ~/.config/assets/wallpapers/lockscreen.png
    blur_passes = 3          # spec: blur allowed here, one of three exceptions
    blur_size = 7
    noise = 0.02              # tiny noise avoids visible banding on the blur
}

# --- Date: bracket-framed label above the time ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%A')"
    color = rgba(199, 199, 199, 1.0)   # text_secondary
    font_family = Inter Medium
    font_size = 18
    position = 0, 160
    halign = center
    valign = center
}

# --- Time: the dominant element, Inter Black, tight tracking ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%I:%M %p')"
    color = rgba(255, 255, 255, 1.0)   # text_primary
    font_family = Inter Black
    font_size = 96
    position = 0, 40
    halign = center
    valign = center
}

# --- Date (YYYY-MM-DD): small bracket label below the time ---
label {
    monitor =
    text = cmd[update:60000] echo "$(date '+%Y-%m-%d')"
    color = rgba(140, 140, 140, 1.0)   # text_muted
    font_family = Inter Medium
    font_size = 14
    position = 0, -40
    halign = center
    valign = center
}

# --- Password field: humble rounded pill, red border on focus ---
input-field {
    monitor =
    size = 260, 44
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(42, 42, 42, 1.0)        # border token, idle
    inner_color = rgba(16, 16, 16, 0.9)         # panel token
    font_color = rgba(255, 255, 255, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##8C8C8C">Password</span>
    hide_input = false
    check_color = rgba(255, 31, 61, 1.0)         # accent_focused on unlock attempt
    fail_color = rgba(176, 0, 32, 1.0)            # accent on failed attempt
    position = 0, -140
    halign = center
    valign = center
    rounding = 22                                  # fully rounded pill
}
