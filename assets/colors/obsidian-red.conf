# ============================================================
# ALTER — COLOR TOKENS ("Obsidian Red" palette)
# ============================================================
# This file is the single source of truth for every color used
# across the desktop. Every other config (waybar CSS, rofi rasi,
# swaync CSS, hyprland conf) either sources this file directly
# or has its values generated from it by install.sh.
#
# "Obsidian Red" names this specific palette (black base +
# crimson/obsidian-red accent), the same way you'd name any
# other color scheme — it is not the project name. The project
# is Alter; Obsidian Red is simply the palette it ships with.
# A future alternate palette would live in a sibling token file
# and get swapped in the same way.
#
# Why this file exists: changing the palette in ONE place should
# propagate everywhere, instead of relying on manually keeping
# a dozen config files in sync (which always drifts over time).
# ============================================================

# --- Surfaces ---
background=090909      # base desktop / app background
panel=101010            # waybar, sidebars, secondary surfaces
card=171717              # elevated surfaces: notification cards, popups

# --- Accent (red) ---
accent=B00020            # default accent — borders, selections, active state
accent_focused=FF1F3D    # focused window border, live/active data
accent_hover=D0002B      # hover state on interactive elements

# --- Text ---
text_primary=FFFFFF      # headings, primary content, terminal body text
text_secondary=C7C7C7    # secondary labels, muted UI text
text_muted=8C8C8C        # timestamps, placeholder text, disabled labels

# --- Structure ---
border=2A2A2A            # inactive window border, dividers
disabled=555555          # disabled controls, inactive icons

# --- Derived / semantic aliases ---
# These map semantic meaning to a token above, so config files
# reference *purpose* (e.g. "warning") rather than a raw hex,
# making intent legible when reading any individual config.
warning=$accent_focused
error=$accent_focused
success=$text_primary    # no green in this palette — success state uses white, not color
info=$text_secondary
